name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - name: Cache real-world org corpus
        uses: actions/cache@v4
        with:
          path: tests/corpus/.cache
          key: org-corpus-${{ hashFiles('scripts/fetch-corpus.mjs') }}
      - name: Fetch real-world org corpus
        run: node scripts/fetch-corpus.mjs
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end and accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          # Test values so the sign-in flow is built and tested (GitHub and the worker are simulated).
          PUBLIC_GITHUB_CLIENT_ID: Ivtest
          PUBLIC_GITHUB_APP_SLUG: mycelium-test
          PUBLIC_GIT_PROXY: https://sync.example.test
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
